name: Release

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use major.minor.patch format: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper

      - name: Set up Chrome for browser tests
        id: chrome
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: 151.0.7922.77
          install-chromedriver: true

      - name: Run test suite
        run: ./gradlew test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build production site
        run: ./gradlew browserProductionDistribution

      - name: Run production acceptance test
        env:
          APPLICATION_URL: http://127.0.0.1:8765/
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 -m http.server 8765 --directory build/dist/browser/production > /tmp/polyhedra-http.log 2>&1 &
          server_pid=$!
          "${{ steps.chrome.outputs.chromedriver-path }}" --port=9515 --log-path=/tmp/polyhedra-chromedriver.log &
          driver_pid=$!
          trap 'kill "$server_pid" "$driver_pid" 2>/dev/null || true' EXIT
          node .github/scripts/acceptance-test.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/dist/browser/production

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
